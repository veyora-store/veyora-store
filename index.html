<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VEYORA STORE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      VEYORA
      <span>STORE</span>
    </div>

    <button class="cart-btn" onclick="openCart()">
      🛒 <span id="cartCount">0</span>
    </button>

  </header>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <p class="small-title">WELCOME TO</p>

      <h1>VEYORA<br>STORE</h1>

      <p>
        Discover stylish products for your
        home & lifestyle.
      </p>

      <button
        class="shop-btn"
        onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
        SHOP NOW
      </button>

    </div>

  </section>


  <!-- SEARCH -->
  <section class="search-section">

    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search products..."
      oninput="searchProducts()">

  </section>


  <!-- CATEGORIES -->
  <section class="categories">

    <button onclick="filterProducts('all')">
      All
    </button>

    <button onclick="filterProducts('home')">
      Home
    </button>

    <button onclick="filterProducts('lifestyle')">
      Lifestyle
    </button>

    <button onclick="filterProducts('beauty')">
      Beauty
    </button>

    <button onclick="filterProducts('electronics')">
      Electronics
    </button>

  </section>


  <!-- PRODUCTS -->
  <main id="products">

    <div class="section-title">

      <p>OUR COLLECTION</p>

      <h2>Featured Products</h2>

    </div>

    <div
      class="product-grid"
      id="productGrid">
    </div>

  </main>


  <!-- CART -->
  <div
    class="cart-overlay"
    id="cartOverlay"
    onclick="closeCart()">
  </div>


  <div
    class="cart"
    id="cart">

    <div class="cart-header">

      <h2>Your Cart</h2>

      <button onclick="closeCart()">
        ✕
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-bottom">

      <div class="total">

        <span>Total</span>

        <strong id="cartTotal">
          ₹0
        </strong>

      </div>

      <button
        class="whatsapp-btn"
        onclick="orderWhatsApp()">

        ORDER VIA WHATSAPP

      </button>

    </div>

  </div>


  <!-- PRODUCT DETAILS -->
  <div
    class="product-modal"
    id="productModal">

    <div class="product-modal-content">

      <button
        class="close-modal"
        onclick="closeProduct()">

        ✕

      </button>

      <img
        id="modalImage"
        src=""
        alt="Product">

      <div class="modal-info">

        <p id="modalCategory"></p>

        <h2 id="modalName"></h2>

        <h3 id="modalPrice"></h3>

        <p id="modalDescription"></p>

        <button
          class="add-modal-btn"
          id="modalAddButton">

          ADD TO CART

        </button>

      </div>

    </div>

  </div>


  <!-- FOOTER -->
  <footer>

    <div class="footer-logo">
      VEYORA
    </div>

    <p>
      Discover. Shop. Enjoy.
    </p>

    <p class="copyright">
      © 2026 VEYORA STORE
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
